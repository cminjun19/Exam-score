<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적 조회</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="login-box">
            <h1>성적 조회</h1>
            <p class="description">성적 조회에 필요한 정보를 입력하세요.</p>

            <input id="gradeCode" type="text" placeholder="성적 코드">
            <input id="studentId" type="text" placeholder="학번">
            <input id="studentName" type="text" placeholder="이름">
            <input id="password" type="password" placeholder="비밀번호">

            <button id="searchButton">성적 조회</button>

            <p id="errorMessage"></p>
        </section>


        <!-- 성적표 -->
        <section id="report" class="report">

            <div class="report-header">
                <h2>성 적 표</h2>
                <p id="semester"></p>
            </div>

            <div class="student-info">
                <div>
                    <span>성명</span>
                    <strong id="name"></strong>
                </div>

                <div>
                    <span>학번</span>
                    <strong id="studentNumber"></strong>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>과목</th>
                        <th>점수</th>
                    </tr>
                </thead>

                <tbody id="subjectList"></tbody>

                <tfoot>
                    <tr>
                        <th>평균</th>
                        <th id="average"></th>
                    </tr>
                </tfoot>
            </table>

            <p class="footer-text">성적 조회 시스템</p>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
