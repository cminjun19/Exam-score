<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>성적 조회</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <!-- =========================
         성적 조회 화면
    ========================== -->

    <section class="login-box">

        <h1>성적 조회</h1>

        <p class="login-description">
            성적 조회에 필요한 정보를 입력하세요.
        </p>

        <div class="input-group">

            <label for="gradeCode">
                성적 코드
            </label>

            <input
                id="gradeCode"
                type="text"
                autocomplete="off"
                placeholder="성적 코드를 입력하세요"
            >

        </div>


        <div class="input-group">

            <label for="studentId">
                학번
            </label>

            <input
                id="studentId"
                type="text"
                autocomplete="off"
                placeholder="학번을 입력하세요"
            >

        </div>


        <div class="input-group">

            <label for="studentName">
                이름
            </label>

            <input
                id="studentName"
                type="text"
                autocomplete="off"
                placeholder="이름을 입력하세요"
            >

        </div>


        <div class="input-group">

            <label for="password">
                비밀번호
            </label>

            <input
                id="password"
                type="password"
                autocomplete="off"
                placeholder="비밀번호를 입력하세요"
            >

        </div>


        <button id="searchButton">
            성적 조회
        </button>


        <div id="errorMessage"></div>

    </section>


    <!-- =========================
         성적표
    ========================== -->

    <section id="report" class="report">

        <!-- 상단 날짜 -->
        <div class="report-top">

            <div
                id="reportDate"
                class="typing-target"
            ></div>

        </div>


        <!-- 제목 -->
        <h2 class="report-title">
            성적 통지표
        </h2>


        <!-- 시험 정보 -->
        <div class="exam-info">

            <span class="book-icon">▣</span>

            <span id="schoolYear"></span>

            <span id="semester"></span>

            <span id="grade"></span>

            <span id="examName"></span>

            <span>
                <span id="className"></span>반
            </span>

            <span>
                <span id="studentNumber"></span>번
            </span>

        </div>


        <!-- 성명 -->
        <div class="student-info">

            <span class="name-label">
                성명 :
            </span>

            <strong id="studentNameResult"></strong>

        </div>


        <!-- 성적 -->
        <table class="grade-table">

            <thead>

                <tr>
                    <th>과목</th>
                    <th>점수</th>
                </tr>

            </thead>


            <tbody id="subjectList"></tbody>


            <tfoot>

                <tr>
                    <th>평균</th>
                    <th id="average"></th>
                </tr>

            </tfoot>

        </table>


        <div class="report-footer">
            성적 조회 시스템
        </div>

    </section>

</div>


<script src="script.js"></script>

</body>
</html>
