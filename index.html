<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성적 조회</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- 조회 화면 -->
    <section class="login-box">

        <h1>성적 조회</h1>

        <p>성적 조회에 필요한 정보를 입력하세요.</p>

        <input id="gradeCode" type="text" placeholder="성적 코드">
        <input id="studentId" type="text" placeholder="학번">
        <input id="studentName" type="text" placeholder="이름">
        <input id="password" type="password" placeholder="비밀번호">

        <button id="searchButton">조회하기</button>

        <div id="errorMessage"></div>

    </section>


    <!-- 성적표 -->
    <section id="report" class="report">

        <!-- 상단 날짜 -->
        <div class="report-top">
            <div id="reportDate"></div>
        </div>


        <!-- 제목 -->
        <h1 class="report-title">성적 통지표</h1>


        <!-- 시험 정보 -->
        <div class="exam-info">

            <span class="book-icon">▣</span>

            <span id="schoolYear"></span>
            <span id="semester"></span>
            <span id="grade"></span>
            <span id="examName"></span>

            <span>
                <span id="className"></span>반
            </span>

            <span>
                <span id="studentNumber"></span>번
            </span>

        </div>


        <!-- 성명 -->
        <div class="student-info">

            <span>성명 :</span>

            <strong id="studentNameResult"></strong>

        </div>


        <!-- 성적표 -->
        <table>

            <thead>
                <tr>
                    <th>과목</th>
                    <th>점수</th>
                </tr>
            </thead>

            <tbody id="subjectList"></tbody>

            <tfoot>
                <tr>
                    <th>평균</th>
                    <th id="average"></th>
                </tr>
            </tfoot>

        </table>


        <div class="report-bottom">
            성적 조회 시스템
        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
